<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detections</title>
<style>
/* ---------------------------------------------------------------
   Contact sheet for recorded detections. No external fonts, no CDN,
   no libraries — the recorder box may have no route to the internet.

   Three cascade layers, in this order:
     theme   this page's colour/type DEFAULTS — deliberately weakest,
             so the site's own stylesheet overrides them and the page
             matches the rest of the project.
     site    /style.css, imported below. Wins over theme.
     layout  structure: grid, aspect ratios, stacking. Deliberately
             strongest, because a site rule like `main{display:block}`
             would otherwise collapse the sheet.

   So the page borrows the project's look and keeps its own bones.
   Standalone (no style.css) it falls back to the light theme here —
   a 404 is harmless.

   Caveat, verified not assumed: the cascade INVERTS layer order for
   !important, so `main{display:block !important}` in style.css would
   still break the layout. Nothing short of shadow DOM prevents that.
   --------------------------------------------------------------- */
@layer theme, site, layout;
@import url("/style.css") layer(site);

@layer theme {
  :root{
    --bg:#ffffff; --panel:#f7f8f9; --sunk:#eef0f2;
    --line:#e3e6ea; --line-soft:#eef0f2;
    --ink:#1b1f24; --dim:#5f6b76; --faint:#8b96a0;
    --person:#c07a10; --vehicle:#15718c; --animal:#4a7c3f; --other:#7d5ba6;
  }
  body{
    background:var(--bg); color:var(--ink);
    font:15px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  h1{font-size:1.05rem; font-weight:600; letter-spacing:.01em}
  select,input[type=search]{
    background:#fff; color:inherit; border:1px solid var(--line);
    border-radius:3px; padding:.3rem .5rem; font-size:.85rem;
  }
  header{background:var(--panel)}
  nav{background:var(--panel)}
  dialog{background:var(--bg); color:var(--ink); border:1px solid var(--line)}
}

@layer layout {
  :root{--sheet-gap:2px}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-variant-numeric:tabular-nums;
  }

  /* ---- header + filters ---- */
  header{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:baseline; gap:1.25rem; flex-wrap:wrap;
    padding:.85rem 1.1rem; border-bottom:1px solid var(--line);
  }
  h1{margin:0}
  h1 span{color:var(--faint); font-weight:400; margin-left:.5rem; font-size:.9rem}
  .filters{display:flex; gap:.6rem; align-items:center; flex-wrap:wrap; margin-left:auto}
  .filters select{font-family:inherit}
  label.toggle{display:flex; align-items:center; gap:.4rem; font-size:.85rem; color:var(--dim)}
  :focus-visible{outline:2px solid var(--vehicle); outline-offset:2px}

  /* ---- frame ---- */
  /* The page scrolls as a document (browser scrollbar, normal wheel and
     find-in-page behaviour). The day rail is pinned below the sticky
     header rather than living in its own scrolling pane; --hdr is measured
     in JS because the site stylesheet can change the header's height. */
  main{display:grid; grid-template-columns:9.5rem 1fr; align-items:start}
  nav{
    position:sticky; top:var(--hdr,3.4rem); align-self:start;
    height:calc(100vh - var(--hdr,3.4rem)); overflow-y:auto;
    border-right:1px solid var(--line); padding:.4rem 0;
  }
  nav button{
    width:100%; text-align:left; background:none; border:0; cursor:pointer;
    color:var(--dim); font:inherit; font-size:.85rem; padding:.45rem .8rem;
    display:flex; justify-content:space-between; gap:.4rem;
    border-left:3px solid transparent; border-radius:0;
  }
  nav button:hover{color:var(--ink)}
  nav button[aria-current=true]{color:var(--ink); border-left-color:var(--vehicle); font-weight:600}
  nav .n{color:var(--faint); font-size:.78rem; font-weight:400}

  /* ---- contact sheet ---- */
  .sheet{
    padding:var(--sheet-gap) var(--sheet-gap) 2rem;
    display:grid; gap:var(--sheet-gap);
    grid-auto-rows:auto;
    grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
    align-content:start;
  }
  .cell{
    position:relative; background:var(--sunk); border:0; padding:0; cursor:pointer;
    aspect-ratio:16/9; overflow:hidden; color:inherit; font:inherit;
    border-radius:0; width:auto; display:block;
  }
  .cell img{width:100%; height:100%; max-width:none; object-fit:cover; display:block; border:0}
  .cell.noimg::after{
    content:attr(data-label); position:absolute; inset:0; display:grid;
    place-items:center; color:var(--faint); font-size:.8rem;
  }
  .cell.still img, .cell.unj img{filter:saturate(.35) brightness(.92)}
  /* stamp sits on the image, so it stays light-on-dark whatever the theme */
  .stamp{
    position:absolute; left:0; right:0; bottom:0;
    display:flex; align-items:center; gap:.45rem;
    padding:.3rem .45rem; font-size:.75rem; line-height:1.3;
    background:linear-gradient(transparent,#000000cc 45%); color:#fff;
  }
  .stamp .time{font-weight:600}
  .stamp .cam{color:#ffffffb8; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .stamp .dur{margin-left:auto; color:#ffffffb8}
  .dot{width:7px; height:7px; border-radius:50%; flex:none}
  .dot.person{background:var(--person)} .dot.vehicle{background:var(--vehicle)}
  .dot.animal{background:var(--animal)} .dot.other{background:var(--other)}
  .parked{
    position:absolute; top:.35rem; left:.35rem; font-size:.68rem;
    padding:.1rem .3rem; border:1px solid #ffffff66; color:#fff;
    background:#00000073; border-radius:2px;
  }
  /* Scroll sentinel: the grid appends another chunk when this comes near
     the viewport. 1px tall and out of the grid so it never takes a cell. */
  #more{height:1px}
  #more[hidden]{display:none}
  .empty{padding:2.5rem 1.2rem; color:var(--dim); max-width:40ch}
  .empty b{display:block; color:var(--ink); font-weight:600; margin-bottom:.35rem}

  /* ---- detail ---- */
  dialog{padding:0; width:min(90vw,880px); border-radius:4px}
  dialog::backdrop{background:#00000066}
  dialog video{width:100%; display:block; background:#000; max-width:none}
  dialog video[hidden]{display:none}
  .gone{padding:2.5rem 1rem; text-align:center; color:var(--dim); background:var(--sunk)}
  .meta{
    display:flex; gap:1rem; flex-wrap:wrap; align-items:center;
    padding:.7rem .9rem; font-size:.85rem; color:var(--dim);
    border-top:1px solid var(--line-soft);
  }
  .meta .k{color:var(--ink); font-weight:600}
  .meta button{margin-left:auto; font:inherit; font-size:.85rem; cursor:pointer; padding:.3rem .7rem}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  /* Phones: single column, controls stacked, day rail as a horizontal
     strip. Document scrolling is now the default at every width. */
  @media (max-width:640px){
    header{padding:.6rem .7rem; gap:.5rem}
    h1{font-size:1rem}
    h1 span{display:block; margin:.15rem 0 0; font-size:.8rem}
    .filters{margin-left:0; width:100%; gap:.5rem}
    .filters select{flex:1 1 0; min-width:0}
    label.toggle{flex:0 0 100%; padding:.1rem 0}

    main{display:block}
    nav{
      position:static; height:auto;
      display:flex; gap:.15rem; overflow-x:auto; overscroll-behavior-x:contain;
      border-right:0; border-bottom:1px solid var(--line); padding:0;
      -webkit-overflow-scrolling:touch;
    }
    nav button{
      width:auto; flex:0 0 auto; white-space:nowrap;
      border-left:0; border-bottom:3px solid transparent;
      padding:.6rem .8rem; gap:.45rem;
    }
    nav button[aria-current=true]{border-left-color:transparent; border-bottom-color:var(--vehicle)}

    .sheet{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
    .stamp{font-size:.72rem; padding:.28rem .4rem; gap:.35rem}
    .empty{padding:1.5rem .9rem}

    dialog{width:96vw; max-width:none}
    .meta{gap:.5rem 1rem; font-size:.8rem}
    .meta button{padding:.45rem .9rem}
  }
}
</style>
</head>
<body>

<header>
  <h1>Detections<span id="count"></span></h1>
  <div class="filters">
    <select id="camera"><option value="">All cameras</option></select>
    <select id="label"><option value="">All objects</option></select>
    <select id="hour" aria-label="Filter by hour"><option value="">All hours</option></select>
    <label class="toggle"><input type="checkbox" id="hideStill" checked> Hide parked, static and unconfirmed</label>
  </div>
</header>

<main>
  <nav id="days" aria-label="Days"></nav>
  <div class="sheet" id="sheet"></div>
  <div id="more" aria-hidden="true"></div>
</main>

<dialog id="detail">
  <video id="player" controls preload="metadata"></video>
  <div id="gone" class="gone" hidden></div>
  <div class="meta">
    <span><span class="k" id="dCam"></span> <span id="dTime"></span></span>
    <span><span class="k" id="dLabel"></span> <span id="dDur"></span></span>
    <span id="dConf"></span>
    <button id="close">Close</button>
  </div>
</dialog>

<script>
/* Where nginx serves the recordings. Change this if your location block
   uses a different path. Trailing slash required. */
const REC_BASE  = "/recordings/";
/* Where this index and the thumbnails live, relative to this page. */
const DET_BASE  = "./";

const FAMILY = {person:"person", dog:"animal", cat:"animal", bird:"animal"};
const VEHICLES = ["car","truck","bus","motorcycle","bicycle"];
const family = l => VEHICLES.includes(l) ? "vehicle" : (FAMILY[l] || "other");

const el = id => document.getElementById(id);
/* A busy day is a couple of thousand tracks, and building that many cells
   up front costs a visible pause on every filter change - so cells are
   appended a chunk at a time as you scroll. CHUNK is a compromise: large
   enough that scrolling never catches up with it, small enough that the
   first paint is immediate. */
const CHUNK = 200;
let rows = [], day = null, view = [], shown = 0;

/* The day rail pins below the sticky header. The header's height depends on
   the site stylesheet's font and padding, so measure rather than hardcode,
   and re-measure when the filters wrap at a different width. */
function measureHeader(){
  const h = document.querySelector("header");
  if(h) document.documentElement.style.setProperty("--hdr", h.offsetHeight + "px");
}
addEventListener("resize", measureHeader);
measureHeader();

async function getJSON(path){
  const r = await fetch(DET_BASE + path, {cache:"no-cache"});
  if(!r.ok) throw new Error(path + ": " + r.status);
  return r.json();
}

async function start(){
  let days;
  try{ days = await getJSON("index/days.json"); }
  catch(e){ return showEmpty("No index yet",
    "Run build_index.py against the detections directory, then reload."); }
  if(!days.length) return showEmpty("Nothing indexed",
    "No manifests were found. Run detection first, then build the index.");

  el("days").innerHTML = "";
  days.forEach((d,i) => {
    const b = document.createElement("button");
    b.innerHTML = `<span>${d.day.slice(5)}</span><span class="n">${d.tracks}</span>`;
    b.title = `${d.day} — ${d.tracks} tracks`;
    b.onclick = () => loadDay(d.day, b);
    el("days").appendChild(b);
    if(i === 0) queueMicrotask(() => b.click());
  });
}

async function loadDay(d, btn){
  [...el("days").children].forEach(b => b.setAttribute("aria-current", b === btn));
  day = d;
  try{ const shard = await getJSON(`index/${d}.json`); rows = shard.tracks; }
  catch(e){ return showEmpty("Can't read that day", e.message); }

  const cams = [...new Set(rows.map(r => r.camera))].sort();
  const labs = [...new Set(rows.map(r => r.label))].sort();
  fill(el("camera"), cams, "All cameras");
  fill(el("label"), labs, "All objects");
  /* Hours reset on every day change: a selection carried over from
     yesterday would silently empty a day that is not actually empty, and
     the reason would be off-screen in a collapsed filter row. */
  el("hour").value = "";
  fillHours();
  render();
  /* With document scrolling, switching day while scrolled down would leave
     you mid-sheet in unrelated footage. Go back to the top. */
  scrollTo({top:0, behavior:"instant"});
  measureHeader();
}

function fill(sel, values, allText){
  const keep = sel.value;
  sel.innerHTML = `<option value="">${allText}</option>` +
    values.map(v => `<option${v === keep ? " selected" : ""}>${v}</option>`).join("");
}

/* Hour options carry the count of what is visible in that hour under the
   other filters, so the dropdown doubles as a readout of when the day was
   busy - the one thing a plain time picker cannot tell you. Hours with
   nothing in them are listed but disabled, so the list stays 24 long and
   an hour is always in the same place. */
function fillHours(){
  const cam = el("camera").value, lab = el("label").value,
        hide = el("hideStill").checked, keep = el("hour").value;
  const n = new Array(24).fill(0);
  for(const r of rows){
    if(cam && r.camera !== cam) continue;
    if(lab && r.label !== lab) continue;
    if(hide && quiet(r)) continue;
    const h = parseInt(r.clock, 10);
    if(h >= 0 && h < 24) n[h]++;
  }
  const total = n.reduce((a, b) => a + b, 0);
  el("hour").innerHTML =
    `<option value="">All hours (${total})</option>` +
    n.map((c, h) => {
      const v = String(h).padStart(2, "0");
      return `<option value="${v}"${v === keep ? " selected" : ""}` +
             `${c ? "" : " disabled"}>${v}:00${c ? ` (${c})` : ""}</option>`;
    }).join("");
  /* The kept hour may have emptied under a new camera or object filter;
     that option is now disabled, so fall back to showing everything. */
  if(keep && !n[parseInt(keep, 10)]) el("hour").value = "";
}

/* "quiet" covers both parked objects and single-sighting detections that
   were never judged moving or stationary - typically a detection sitting
   on the confidence threshold, which has no evidence behind it either
   way. Older index shards have no unj field and are unaffected. */
const quiet = r => r.still || r.unj;

function render(){
  const cam = el("camera").value, lab = el("label").value,
        hour = el("hour").value, hide = el("hideStill").checked;
  const inHour = r => !hour || r.clock.slice(0, 2) === hour;
  const list = rows.filter(r =>
    (!cam || r.camera === cam) && (!lab || r.label === lab) && inHour(r)
    && !(hide && quiet(r)));

  el("count").textContent = list.length
    ? `${list.length} of ${rows.length} on ${day}${hour ? ` at ${hour}:00` : ""}`
    : "";

  const sheet = el("sheet");
  sheet.innerHTML = "";
  if(!list.length){
    /* Say which filter is actually responsible: only blame the static
       toggle if unticking it would really reveal something. */
    const hidden = rows.filter(r =>
      (!cam || r.camera === cam) && (!lab || r.label === lab) && inHour(r)
      && quiet(r)).length;
    return showEmpty("Nothing matches these filters",
      hide && hidden
        ? `${hidden} parked, static or unconfirmed ${hidden === 1 ? "object is" : "objects are"} hidden. Untick the filter to see them.`
        : `Try another camera, object, ${hour ? "hour, " : ""}or day.`);
  }
  view = list; shown = 0;
  el("more").hidden = false;
  renderChunk();
  fillViewport();
}

function cell(r){
  const b = document.createElement("button");
  b.className = "cell" + (r.still ? " still" : "") + (r.unj ? " unj" : "")
              + (r.thumb ? "" : " noimg");
  b.dataset.label = r.label;
  b.onclick = () => openDetail(r);
  if(r.thumb){
    const img = document.createElement("img");
    img.loading = "lazy"; img.alt = `${r.label} on ${r.camera} at ${r.clock}`;
    img.src = DET_BASE + r.thumb;
    img.onerror = () => { b.classList.add("noimg"); img.remove(); };
    b.appendChild(img);
  }
  if(r.still) b.insertAdjacentHTML("beforeend", `<span class="parked">static</span>`);
  else if(r.unj) b.insertAdjacentHTML("beforeend", `<span class="parked">seen once</span>`);
  b.insertAdjacentHTML("beforeend",
    `<span class="stamp"><span class="dot ${family(r.label)}"></span>` +
    `<span class="time">${r.clock}</span>` +
    `<span class="cam">${r.camera}</span>` +
    `<span class="dur">${Math.round(r.dur)}s</span></span>`);
  return b;
}

function renderChunk(){
  const end = Math.min(shown + CHUNK, view.length);
  const frag = document.createDocumentFragment();
  for(let i = shown; i < end; i++) frag.appendChild(cell(view[i]));
  el("sheet").appendChild(frag);
  shown = end;
  if(shown >= view.length) el("more").hidden = true;
}

/* A chunk may not reach the bottom of a tall window (or the day may have
   been filtered down to a handful), in which case the sentinel never
   leaves the viewport and would never fire again. Keep appending until
   the page is scrollable past it, with a guard so a pathological case
   cannot spin. */
function fillViewport(){
  let guard = 0;
  while(shown < view.length && guard++ < 50 &&
        document.documentElement.scrollHeight <= innerHeight + 600)
    renderChunk();
}

const moreObserver = new IntersectionObserver(entries => {
  if(entries.some(e => e.isIntersecting) && shown < view.length){
    renderChunk();
    fillViewport();
  }
}, {rootMargin: "800px 0px"});

function showEmpty(title, body){
  view = []; shown = 0;
  el("more").hidden = true;
  el("sheet").innerHTML = `<div class="empty"><b>${title}</b>${body}</div>`;
}

function openDetail(r){
  const v = el("player");
  v.hidden = false; el("gone").hidden = true;
  /* A manifest can outlive its recording by design (manifests are kept
     longer as a searchable index). A missing file and an unplayable codec
     fire the same error event, so check which it is before blaming
     retention — an H.265 camera in Firefox is a codec problem, not a
     missing recording. */
  v.onerror = async () => {
    v.hidden = true;
    let msg = "This recording can't be played.";
    try{
      const h = await fetch(v.src, {method:"HEAD", cache:"no-store"});
      msg = h.ok
        ? "The recording exists but this browser can't decode its video format. H.264 plays everywhere; H.265/HEVC does not."
        : "This recording is no longer on disk — the detection outlived the video's retention window.";
    }catch(e){}
    el("gone").textContent = msg; el("gone").hidden = false;
  };
  v.src = REC_BASE + r.src;
  v.currentTime = 0;
  /* Seek once metadata is available; a few seconds of lead-in gives the
     event context instead of starting mid-motion. */
  v.onloadedmetadata = () => { v.currentTime = Math.max(0, r.t - 3); };
  el("dCam").textContent = r.camera;
  el("dTime").textContent = `${r.day} ${r.clock}`;
  el("dLabel").textContent = r.label + (r.still ? " (static)" : "");
  el("dDur").textContent = `${Math.round(r.dur)}s`;
  el("dConf").textContent = r.conf ? `confidence ${r.conf}` : "";
  el("detail").showModal();
}

el("close").onclick = () => el("detail").close();
el("detail").addEventListener("close", () => { el("player").pause(); el("player").src = ""; });
["camera","label","hideStill"].forEach(id => el(id).onchange = () => {
  fillHours();   // counts depend on the other filters
  render();
});
el("hour").onchange = render;
moreObserver.observe(el("more"));
start();
</script>
</body>
</html>
