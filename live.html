<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Cameras</title>
    <script src="./vendor/hls/hls.min.js"></script>
    <script src="./vendor/ovenplayer/ovenplayer.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<a class="home-link" href="/" title="Back to Home">&larr; Home</a>
<div id="welcomeContainer">
    <div id="welcomeMessage">
        <p>Welcome! Please query your live camera group.</p>
        <div id="versionInfo" style="text-align: center; margin: 10px 0; font-size: 0.6em;"></div>
        <script>
        fetch(`/version.txt?timestamp=${new Date().getTime()}`)
                .then(response => response.text())
                .then(version => {
                    document.getElementById('versionInfo').innerText = `${version.trim()}`;
                })
                .catch(error => console.error('Error fetching version:', error));
        </script>
    </div>
</div>
<div id="searchContainer">
    <div id="search-wrapper">
        <input type="text" id="searchTerm" placeholder="Example: Building room" onkeyup="searchOnEnter(event)">
        <button id="searchButton" onclick="filterCameras()">Search</button>
        <button id="resetButton" onclick="window.location.reload()" style="display: none;">Reset</button>
    </div>
</div>
<div id="paginationControls" style="display: none;">
    <button id="previousPage" onclick="navigatePage(-1)">Previous Page</button>
    <span id="currentPage">Page 1 of 1</span>
    <button id="nextPage" onclick="navigatePage(1)">Next Page</button>
</div>
<br>
<br>
<br>
<div class="player-wrapper" id="wrapper"></div>

<script>
    // Each camera is { app, name, label, id }. The same camera name can exist in
    // both the main (cam) and sub-stream (cam-sub) applications, so the label
    // and player id carry the application to keep the two apart.
    let allCameras = []; // Array to store the full list of cameras
    let cameras = [];
    let playerContainers = {}; // Tracks player instances by their container ID
    let currentPage = 1; // Variable to track the current page in pagination
    const CAMERAS_PER_PAGE = 15; // Number of cameras to display per page

    // Label suffix for sub-stream cameras, so a search for "FrontDoor" shows
    // both FrontDoor (main) and FrontDoor-sub (sub-stream). Sub-streams already
    // named with a sub prefix or suffix (subFrontDoor, FrontDoorsub) keep
    // their name as-is.
    const SUB_LABEL_SUFFIX = '-sub';
    const SUB_NAME_RE = /^sub[-_]?|[-_]?sub$/i;

    // Map an nginx-rtmp application name to the URL prefix that serves its
    // HLS playlists. Keep in step with appHlsBase() in kiosk.html and the
    // locations in the nginx "default" site.
    function appHlsBase(app) {
        switch (app) {
            case 'cam':
                return 'hls';        // hls_path /tmp/hls
            case 'cam-sub':
                return 'sub-hls';    // hls_path /tmp/sub-hls
            default:
                return `hls/${app}`;
        }
    }

    function cameraLabel(app, name) {
        if (app !== 'cam-sub' || SUB_NAME_RE.test(name)) return name;
        return name + SUB_LABEL_SUFFIX;
    }

    // Camera name without any sub prefix/suffix, used for sorting so a
    // sub-stream sits next to its main camera (ES_Cam32, subES_Cam32).
    function baseName(camera) {
        return camera.app === 'cam-sub' ? camera.name.replace(SUB_NAME_RE, '') : camera.name;
    }

    // Function to display the cameras for the current page
    function displayCameras() {
        const startIndex = (currentPage - 1) * CAMERAS_PER_PAGE;
        const endIndex = startIndex + CAMERAS_PER_PAGE;
        const pageCameras = cameras.slice(startIndex, endIndex); // Get cameras for the current page

        cleanupPlayers(); // Clean up existing players before displaying new ones
        pageCameras.forEach(camera => {
            addCamera(camera); // Prepare the container and overlay
            startPlayer(camera); // Start the player for the camera
        });

        // Update pagination controls
        document.getElementById('paginationControls').style.display = cameras.length > CAMERAS_PER_PAGE ? 'block' : 'none';
        document.getElementById('currentPage').innerText = `Page ${currentPage} of ${Math.ceil(cameras.length / CAMERAS_PER_PAGE)}`;
    }

    // Function to navigate between pages
    function navigatePage(direction) {
        const totalPages = Math.ceil(cameras.length / CAMERAS_PER_PAGE);
        if ((direction === -1 && currentPage > 1) || (direction === 1 && currentPage < totalPages)) {
            currentPage += direction;
            displayCameras();
        }
    }


    function addCamera(camera) {
        let wrapper = document.getElementById('wrapper');
        let container = document.createElement('div');
        container.className = 'camera-container';

        let playerDiv = document.createElement('div');
        playerDiv.className = 'camera-preview';
        playerDiv.id = camera.id; // Unique per application + name

        let overlay = document.createElement('div');
        overlay.className = 'camera-overlay';
        overlay.innerText = camera.label; // Sub-streams carry the -sub suffix

        container.appendChild(playerDiv);
        container.appendChild(overlay);
        wrapper.appendChild(container);

        // No player initialization here. Just preparing the containers.
    }

    function startPlayer(camera) {
        const playerDivId = camera.id;
        if (!playerContainers[playerDivId]) { // Check if player was already created
            const player = OvenPlayer.create(playerDivId, {
                autoStart: true,
                autoFallback: false,
                mute: true,
                controls: true,
                sources: [{
                    "file": `${appHlsBase(camera.app)}/${camera.name}.m3u8`,
                    "label": "hls",
                    "type": "hls"
                }],
            });

            playerContainers[playerDivId] = player; // Track the player instance
        }
    }

    function cleanupPlayers() {
        Object.keys(playerContainers).forEach(containerId => {
            let playerElement = document.getElementById(containerId);
            if (playerElement && playerElement.parentNode) {
                let parentContainer = playerElement.parentNode;
                if (parentContainer && parentContainer.parentNode) {
                    parentContainer.parentNode.removeChild(parentContainer);
                }
                console.log('Complete camera container removed:', containerId);
            }
        });
        playerContainers = {};
    }

    // Function to filter cameras based on search input
    function filterCameras() {
        const searchTerm = document.getElementById('searchTerm').value.trim().toLowerCase();

        if (!searchTerm) {
            alert('Please enter a search term.');
            return;
        }

        const searchTerms = searchTerm.split(' ');
        cleanupPlayers(); // Clean up existing players before filtering

        document.getElementById('welcomeMessage').style.display = 'none';
        document.getElementById('searchButton').style.display = 'none';
        document.getElementById('resetButton').style.display = 'inline';

        let filteredCameras = allCameras; // Always start filtering from the full list
        searchTerms.forEach(term => {
            filteredCameras = filteredCameras.filter(camera => camera.label.toLowerCase().includes(term));
        });

        cameras = filteredCameras.slice().sort(compareCameras); // Update the cameras array with filtered results
        currentPage = 1; // Reset to the first page
        displayCameras(); // Display the filtered cameras
    }

    function searchOnEnter(event) {
        if (event.keyCode === 13) {
            filterCameras();
        }
    }

    // Sort by base camera name, then main before sub, so FrontDoor sits next
    // to its sub-stream (FrontDoor-sub or subFrontDoor).
    function compareCameras(a, b) {
        const an = baseName(a), bn = baseName(b);
        if (an !== bn) return an < bn ? -1 : 1;
        if (a.app === b.app) return 0;
        return a.app === 'cam' ? -1 : 1;
    }

    // Function to fetch and initialize cameras
    function fetchCameras() {
        console.log('Request active RTMP streams');
        const xhr = new XMLHttpRequest();
        xhr.open('GET', 'stat', true);
        xhr.responseType = 'document';
        xhr.onload = function () {
            if (xhr.status === 200) {
                const xml = xhr.responseXML;
                // Walk each camera application separately so every stream
                // keeps track of which application (main or sub) it came from.
                const appIter = xml.evaluate(`/rtmp/server/application[contains(name, "cam")]`,
                    xml, null, XPathResult.ORDERED_NODE_SNAPSHOT_TYPE, null);
                const seen = new Set();

                for (let i = 0; i < appIter.snapshotLength; i++) {
                    const appNode = appIter.snapshotItem(i);
                    const app = xml.evaluate('string(name)', appNode, null, XPathResult.STRING_TYPE, null).stringValue.trim();
                    const streamIter = xml.evaluate('live/stream/name', appNode, null, XPathResult.ORDERED_NODE_SNAPSHOT_TYPE, null);

                    for (let j = 0; j < streamIter.snapshotLength; j++) {
                        const name = streamIter.snapshotItem(j).textContent.trim();
                        const key = app + '/' + name;
                        if (!name || seen.has(key)) continue;
                        seen.add(key);
                        allCameras.push({
                            app: app,
                            name: name,
                            label: cameraLabel(app, name),
                            id: 'player-' + allCameras.length
                        });
                    }
                }

                allCameras.sort(compareCameras); // Sort the full list alphabetically
                cameras = [...allCameras]; // Initialize the display list
                // Cameras are now fetched and stored. Players are not created here.
            }
        };
        xhr.send();
    }

    window.onload = fetchCameras;
</script>
</body>
</html>
